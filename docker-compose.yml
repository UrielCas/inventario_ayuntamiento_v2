version: '3.8'

services:
  db:
    image: postgres:15
    container_name: ayuntamiento_db
    environment:
      POSTGRES_USER: admin_tics
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: helpdesk_inventario
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

volumes:
  pgdata: